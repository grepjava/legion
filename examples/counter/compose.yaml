# A hit counter: a web tier of two tasks (inetd and sh, from FreeBSD's
# base) counting in Redis, which keeps its count on a Volume. The web tier
# finds Redis by name, through its VIP; the count outlives Redis's task.
#
#   legion stack deploy counter -c examples/counter/compose.yaml
#
# GET / on port 30082 of any node answers `hits <n>`.
services:
  redis:
    image: "${IMAGE:-localhost/examples/redis:1}"
    command:
      [/usr/local/bin/redis-server, --dir, /data, --appendonly, "yes",
       --protected-mode, "no", --save, ""]
    ports: ["6379"]
    volumes: ["counts:/data"]
    deploy:
      resources: { limits: { memory: 128M } }
  web:
    image: "${IMAGE:-localhost/examples/redis:1}"
    command: [/usr/sbin/inetd, -d, /etc/inetd.conf]
    ports: ["30082:8080"]
    configs:
      - { source: services, target: /etc/services }
      - { source: inetd, target: /etc/inetd.conf }
      - { source: web-sh, target: /etc/counter/web.sh }
    deploy:
      replicas: 2
      resources: { limits: { memory: 64M, pids: 64 } }
volumes:
  counts:
    x-legion: { size: 256Mi }
configs:
  services:
    # inetd takes service names, not port numbers.
    content: |
      counter-web    8080/tcp
  inetd:
    content: |
      counter-web stream tcp nowait root /bin/sh sh /etc/counter/web.sh
  web-sh:
    content: |
      # One HTTP/1.0 request on stdin, the response on stdout.
      read -r method path proto
      while read -r line; do
        [ -z "$$(printf %s "$$line" | tr -d '\r')" ] && break
      done
      reply() { printf 'HTTP/1.0 %s\r\nContent-Type: text/plain\r\n\r\n%s\n' "$$1" "$$2"; }
      case "$$path" in
        /) n=$$(/usr/local/bin/redis-cli -h redis incr hits 2>/dev/null) &&
             [ -n "$$n" ] && reply "200 OK" "hits $$n" ||
             reply "503 Service Unavailable" "no redis" ;;
        *) reply "404 Not Found" "" ;;
      esac
