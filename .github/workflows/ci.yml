name: CI

on:
  push:
    branches: [main]
  pull_request:

# The emulated aarch64 job takes about an hour; a newer push to the same
# branch or pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  console:
    name: console (type check, messages, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/legion-console/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/legion-console/web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  freebsd:
    name: test (FreeBSD 15.1 ${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/freebsd-vm@v1.5.9
        with:
          release: "15.1"
          arch: ${{ matrix.arch }}
          mem: 8192
          copyback: false
          prepare: |
            pkg install -y rust
          run: |
            freebsd-version
            rustc --version
            cargo test --workspace
