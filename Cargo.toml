[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "BSD-2-Clause"
publish = false

[workspace.dependencies]
legion-agent = { path = "crates/legion-agent" }
legion-api = { path = "crates/legion-api" }
legion-image = { path = "crates/legion-image" }
legion-manager = { path = "crates/legion-manager" }
legion-net = { path = "crates/legion-net" }
legion-pki = { path = "crates/legion-pki" }
legion-podman = { path = "crates/legion-podman" }
legion-proto = { path = "crates/legion-proto" }
legion-store = { path = "crates/legion-store" }
legion-sys = { path = "crates/legion-sys" }

anyhow = "1.0"
base64 = "0.22"
bytes = "1.12"
clap = { version = "4.6", features = ["derive"] }
form_urlencoded = "1.2"
futures = "0.3"
getrandom = "0.3"
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
http = "1.5"
http-body-util = "0.1.5"
hyper = "1.12"
hyper-util = "0.1.21"
libc = "0.2"
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "x509-parser"] }
openraft = { version = "0.9.25", features = ["serde", "storage-v2"] }
prost = "0.14"
protox = "0.10"
redb = "4.4"
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
similar = "2"
tempfile = "3"
time = "0.3"
thiserror = "2.0"
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tracing = "0.1"
x509-parser = "0.18"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
