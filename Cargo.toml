[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "BSD-2-Clause"
publish = false

[workspace.dependencies]
legion-api = { path = "crates/legion-api" }
legion-manager = { path = "crates/legion-manager" }
legion-proto = { path = "crates/legion-proto" }
legion-store = { path = "crates/legion-store" }

anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
futures = "0.3"
openraft = { version = "0.9.25", features = ["serde", "storage-v2"] }
prost = "0.14"
protox = "0.10"
redb = "4.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
