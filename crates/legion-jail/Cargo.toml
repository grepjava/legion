[package]
name = "legion-jail"
description = "Legion's jail runtime: containers as jails on ZFS clones of their images, with a supervisor per process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytes.workspace = true
futures.workspace = true
getrandom.workspace = true
legion-agent.workspace = true
legion-image.workspace = true
legion-sys.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process", "macros", "rt-multi-thread"] }
