[package]
name = "legion-build"
description = "FreeBSD OCI image builder, Containerfile parser, signing, and attestations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
base64.workspace = true
bytes.workspace = true
clap.workspace = true
flate2 = "1.1"
futures.workspace = true
getrandom.workspace = true
legion-api.workspace = true
legion-image.workspace = true
legion-jail.workspace = true
legion-local.workspace = true
legion-runtime.workspace = true
legion-sys.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar = { version = "0.4", default-features = false }
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process"] }
tracing.workspace = true
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
http-body-util.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
