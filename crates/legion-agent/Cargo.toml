[package]
name = "legion-agent"
description = "Legion agent: registers the node and runs its assigned tasks as pod jails"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
bytes.workspace = true
futures.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "server", "http1", "http2"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "http2", "server-auto", "tokio"] }
tokio-rustls.workspace = true
legion-api.workspace = true
legion-net.workspace = true
legion-proto.workspace = true
legion-runtime.workspace = true
legion-sys.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process"] }
tokio-stream.workspace = true
tonic = { workspace = true, features = ["tls-ring"] }
tonic-health.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
rcgen.workspace = true
legion-manager.workspace = true
legion-store.workspace = true
openraft.workspace = true
serde_yaml_ng.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
