[package]
name = "legion-image"
description = "OCI images for Legion's jail runtime: a registry client and a store of layers as ZFS snapshots"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
flate2 = "1.1"
futures.workspace = true
legion-sys.workspace = true
libc.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "system-proxy", "stream", "json", "query"] }
ruzstd = "0.9"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar = { version = "0.4", default-features = false }
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
tokio-rustls.workspace = true
tracing.workspace = true

[dev-dependencies]
bytes.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
