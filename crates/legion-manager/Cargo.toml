[package]
name = "legion-manager"
description = "Legion manager: API server and Raft transport over the store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
base64.workspace = true
bytes.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hyper-rustls.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1", "http2", "server-auto", "service", "tokio"] }
instant-acme.workspace = true
legion-api.workspace = true
legion-console.workspace = true
legion-image.workspace = true
legion-net.workspace = true
legion-pki.workspace = true
legion-proto.workspace = true
legion-store.workspace = true
legion-sys.workspace = true
openraft.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-stream.workspace = true
tonic = { workspace = true, features = ["tls-ring"] }
tower-layer.workspace = true
tower-service.workspace = true
tracing.workspace = true

[features]
# Pause points for tests that drive races; never in a release build.
test-hooks = []

[dev-dependencies]
# Its own integration tests get the pause points.
legion-manager = { path = ".", features = ["test-hooks"] }
hyper = { workspace = true, features = ["client", "http1", "server"] }
rcgen.workspace = true
legion-pki.workspace = true
serde_yaml_ng.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
