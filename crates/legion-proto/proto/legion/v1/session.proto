// Sessions with a task's containers (DESIGN.md §4.2): logs, exec and
// port-forward. A user opens one at any manager, which checks their rights,
// offers it to the agent of the task's node over that agent's `Sessions`
// stream, and joins the user's stream to the one the agent opens with
// `Attach`.
syntax = "proto3";

package legion.v1;

service Pods {
  // The client's first frame is `open`; after it, for exec and
  // port-forward, input. The server sends output and, for exec, ends with
  // `exit_code`. Logs and forwarded connections end when their stream does.
  rpc Session(stream SessionFrame) returns (stream SessionFrame);
}

message SessionOpen {
  string namespace = 1;
  // A task, or a service, for one of its running tasks.
  string task = 2;
  // The container; may be left out when the pod has only one.
  string container = 3;
  oneof action {
    LogsOptions logs = 4;
    ExecOptions exec = 5;
    // Port-forward: one forwarded connection to this port of the pod.
    uint32 port = 6;
    // Managers only, moving a Volume's data between nodes (DESIGN.md
    // §4.3): the sending agent's output is the receiving agent's input.
    VolumeSend volume_send = 7;
    VolumeReceive volume_receive = 8;
    // Remove this node's copy of a Volume that has moved away.
    string volume_drop = 9;
    // Managers only, a Volume's backup and its restore (DESIGN.md §4.3):
    // the data goes to and comes from the user's stream.
    VolumeExport volume_export = 10;
    VolumeImport volume_import = 11;
    // Managers only, a Build (CONSOLE.md phase 5): build an image with
    // `legion local` on this node and push it.
    BuildOptions build = 12;
    // Managers only: list, create, roll back or delete a ZFS Volume's
    // snapshots on the node holding it.
    VolumeSnapshotAction volume_snapshot = 13;
    // Managers only: list, pull, push, remove, prune, export or load images
    // in a node's local image store.
    ImageNodeAction image_op = 14;
    // Managers only: what `legion doctor` finds on this node, as JSON on
    // `stdout`, then `exit_code` 0. It changes nothing on the host.
    DoctorOptions doctor = 15;
    // Files in the container's root: a directory listed (JSON on
    // `stdout`), a file read (its bytes on `stdout`) or written (from
    // `input` frames until `input_closed`), then `exit_code` 0. A symbolic
    // link on the way is refused, not followed.
    FilesOptions files = 16;
    // Managers only, a ZFS Volume's replica (DESIGN.md §6.4): the holder
    // snapshots and sends, the replica's node receives, unmounted.
    ReplicaSend replica_send = 17;
    ReplicaReceive replica_receive = 18;
    // Managers only: make this node's exports (the NFS and iSCSI Volumes
    // it provides) exactly these; what it says of each as JSON on
    // `stdout`, then `exit_code` 0.
    ExportSync export_sync = 19;
    // Managers only: the connections this node's pf keeps state for that
    // a pod's address is an end of, as JSON on `stdout`, then `exit_code`
    // 0. It changes nothing on the host. An agent from before it ends the
    // session with an error: the session has no action.
    ConnectionsOptions connections = 20;
    // Managers only, a Volume's backups (DESIGN.md §4.3, Volume backups):
    // one taken and sent to its target and the target pruned, those the
    // target holds listed, one restored onto this node.
    BackupRun backup_run = 21;
    BackupList backup_list = 22;
    BackupRestore backup_restore = 23;
    // Managers only: the resume token of a copy of the Volume cut short
    // that this node kept (`zfs receive -s`: a replica's, or a move's full
    // copy), on `stdout` (nothing if none), then `exit_code` 0. An agent
    // from before it ends the session with an error: the session has no
    // action.
    ResumeToken resume_token = 24;
    // Managers only, a replicated database's log archiving (DESIGN.md
    // 6.9): the files of a member's spool shipped to the target and
    // removed, the target pruned when asked. An agent from before it ends
    // the session with an error: the session has no action.
    ArchiveRun archive_run = 25;
  }
}

message ConnectionsOptions {}

message ExportSync {
  repeated ExportWanted exports = 1;
  // The addresses NFS exports are shared with: the cluster's nodes'.
  repeated string clients = 2;
}

message ExportWanted {
  string namespace = 1;
  string volume = 2;
  // "nfs" or "iscsi".
  string kind = 3;
  // Bytes: the quota, or the LUN's size; 0 for no quota.
  uint64 size = 4;
}

// Snapshots the Volume as `snapshot` and sends it: all of it, or with
// `base` what changed since that snapshot, the last the replica holds.
// The holder's older replica snapshots go first.
message ReplicaSend {
  string volume = 1;
  string snapshot = 2;
  string base = 3;
  // Goes on with a copy cut short instead, from the receiving node's
  // resume token (`zfs send -t`): it must send this Volume's `snapshot`.
  // Nothing is snapshotted or dropped.
  string resume_token = 4;
}

message ResumeToken {
  string volume = 1;
}

// Receives what `ReplicaSend` sends: a full copy replaces what is here; an
// incremental one needs `base` here. It stays unmounted; the replica's
// older snapshots go once it is taken.
message ReplicaReceive {
  string volume = 1;
  string snapshot = 2;
  string base = 3;
  // Takes the rest of a copy cut short, which this node kept, rather than
  // a new one.
  bool resume = 4;
}

message FilesOptions {
  // "list", "read" or "write".
  string op = 1;
  // Below the container's root: `/etc/rc.conf`.
  string path = 2;
}

message DoctorOptions {}

message VolumeSnapshotAction {
  string volume = 1;
  // "list", "create", "rollback", "delete"; "auto", a schedule's snapshot
  // (`legion-auto-<every>-<stamp>`) taken and that schedule's pruned to
  // `keep`, the oldest first.
  string op = 2;
  string snapshot = 3;
  // For "auto": how many of the schedule's snapshots are kept.
  uint32 keep = 4;
  // For "clone": the new Volume (in the same namespace) the snapshot's
  // data is copied into, on this node; a copy, so it needs nothing of the
  // snapshot after.
  string into = 5;
}

message VolumeSnapshotResult {
  repeated string snapshots = 1;
}

message ImageNodeAction {
  // "list", "inspect", "pull", "push", "remove", "prune", "export",
  // "load"; "prune-builds", the builder's store pruned on a builder; "scan",
  // the image's packages audited.
  string op = 1;
  string image = 2;
  string target = 3;
  bytes auth = 4;
  repeated string plain_http = 5;
}

message CachedNodeImage {
  string reference = 1;
  string digest = 2;
  string os = 3;
  string arch = 4;
  uint32 layers = 5;
  // A VM image (`legion.vm.image`), not a jail's.
  bool vm = 6;
}

message ImageNodeResult {
  repeated CachedNodeImage images = 1;
  uint64 removed = 2;
  string digest = 3;
  // "inspect": the image's config, as JSON, and its compressed layers'
  // sizes, bottom first, where the store keeps them.
  string config = 4;
  repeated uint64 layer_sizes = 5;
  // "scan": what `pkg audit --raw=json-compact` said of the image's
  // packages (empty when it has none), and the packages, `name\tversion`.
  string audit = 6;
  repeated string packages = 7;
}

// The output of `legion local build` and `push` comes as `stdout` and
// `stderr` frames, as written; then `built`, then `exit_code` 0. A node
// without a builder program, or not a builder, ends with `error`.
message BuildOptions {
  // A Git repository read with no login, its ref (the default branch when
  // empty) and the directory in it built; or, with no `git_url`, the
  // Containerfile, built with nothing beside it.
  string git_url = 1;
  string git_ref = 2;
  string git_path = 3;
  string containerfile = 4;
  // Where to push, `registry/repository:tag`.
  string image = 5;
  // A Docker config holding the registry's login; empty for none.
  bytes auth = 6;
  // Registries spoken to over plain HTTP, as the cluster's are.
  repeated string plain_http = 7;
  // A P-256 private key (PEM): the image is pushed signed with it, and
  // its provenance and SBOM attested (legion local push --sign-key, attest).
  bytes sign_key = 8;
}

// What a build pushed.
message BuildResult {
  // The manifest, `sha256:…`, and the image pinned to it.
  string digest = 1;
  string pinned = 2;
}

// Snapshots the Volume, as it is while its tasks run (crash-consistent),
// sends all of it as `stdout` frames and drops the snapshot, ending with
// `exit_code` 0.
message VolumeExport {
  string volume = 1;
}

// Takes what `VolumeExport` sent, from `input` frames until
// `input_closed`, as the Volume's data on this node, which must have none,
// mounts it and ends with `exit_code` 0.
message VolumeImport {
  string volume = 1;
}

// Snapshots the Volume and sends it as `stdout` frames, ending with
// `exit_code` 0.
message VolumeSend {
  string volume = 1;
  // Only what changed since the full copy, from a second snapshot.
  bool last = 2;
  // Goes on with the full copy cut short instead, from the receiving
  // node's resume token (`zfs send -t`): it must send the move's full
  // snapshot, which is kept, not taken again.
  string resume_token = 3;
}

// Receives what `VolumeSend` sends, from `input` frames until
// `input_closed`, and ends with `exit_code` 0.
message VolumeReceive {
  string volume = 1;
  // The last part: afterwards the dataset is mounted and the migration's
  // snapshots go.
  bool last = 2;
  // Takes the rest of the full copy cut short, which this node kept,
  // rather than a new one.
  bool resume = 3;
}

message LogsOptions {
  // Keep streaming until the container stops.
  bool follow = 1;
  // Only the last lines (of those in the range, when one is given).
  optional uint32 tail = 2;
  // Only lines written from `since_ms` and before `until_ms`, in
  // milliseconds since the epoch. With either, a line whose time the node
  // does not know is left out. Agents from before ignore both.
  optional int64 since_ms = 3;
  optional int64 until_ms = 4;
  // Each line as a `line` frame, with its time, rather than as `stdout`
  // and `stderr` frames. Agents from before ignore it.
  bool times = 5;
}

// A line of a container's output, with when it was written.
message LogLine {
  bool stderr = 1;
  bytes data = 2;
  // Milliseconds since the epoch; 0 when the node does not know.
  int64 at_ms = 3;
}

message ExecOptions {
  repeated string command = 1;
  // Pass input to the process's stdin.
  bool stdin = 2;
  // Run under a terminal, which merges stderr into stdout.
  bool tty = 3;
  optional TerminalSize size = 4;
}

message TerminalSize {
  uint32 width = 1;
  uint32 height = 2;
}

message SessionError {
  // A gRPC status code.
  int32 code = 1;
  string message = 2;
}

message InputClosed {}

message SessionFrame {
  oneof frame {
    SessionOpen open = 1;
    // To the process's stdin, or the forwarded connection.
    bytes input = 2;
    // No more input: stdin or the connection's sending side closes.
    InputClosed input_closed = 3;
    TerminalSize resize = 4;
    // From the process, or the forwarded connection.
    bytes stdout = 5;
    bytes stderr = 6;
    // The process has exited; the last frame of an exec.
    int32 exit_code = 7;
    // Agents only: the first frame of `Attach`, naming the session.
    string attach = 8;
    // The session failed; the last frame.
    SessionError error = 9;
    // Logs asked with `times`: a line and when it was written.
    LogLine line = 10;
    // A build's result, before its `exit_code`.
    BuildResult built = 11;
    // A Volume snapshot action's result, before its `exit_code`.
    VolumeSnapshotResult snapshots = 12;
    // A node image action's result, before its `exit_code`.
    ImageNodeResult images = 13;
  }
}

// What a manager offers an agent.
message SessionOffer {
  string id = 1;
  // With the namespace, task and container resolved.
  SessionOpen open = 2;
  // The task's run, which the agent knows its containers by.
  string task_uid = 3;
  // The pod's address, for port-forward.
  string pod_ip = 4;
}

// Where a Volume's backups go, as the agent reaches it: the BackupTarget's
// spec (JSON) with the value of the Secret it names, if any: for SSH the
// private key, for S3 the secret access key. An agent from before S3
// targets refuses one, its spec having a field unknown to it (`s3`).
message BackupTargetAccess {
  string name = 1;
  string spec_json = 2;
  bytes key = 3;
}

// Snapshots the Volume as `snapshot`, sends it to the target (what changed
// since `base` when both still hold it, else whole) and prunes the
// target's to `keep`; says `{"bytes", "whole", "held"}` as JSON on
// `stdout`, then `exit_code` 0.
message BackupRun {
  string volume = 1;
  BackupTargetAccess target = 2;
  string snapshot = 3;
  string base = 4;
  uint32 keep = 5;
}

// Ships each finished file of the spool at `path` in the Volume `volume`
// (its mountpoint's relative path) to the target, under
// `<prefix>/<of>/wal/<name>` (`of` is `<namespace>.<service>`), unless the
// target holds it already, then removes it from the spool; files ending
// `.part` are still being written. With `prune`, removes the target's
// older than `keep_seconds`. Says `{"shipped", "bytes", "last", "pending",
// "pruned"}` as JSON on `stdout`, then `exit_code` 0.
message ArchiveRun {
  string volume = 1;
  string path = 2;
  BackupTargetAccess target = 3;
  string of = 4;
  uint64 keep_seconds = 5;
  bool prune = 6;
}

// The Volume's backups the target holds, oldest first, as `snapshots`.
message BackupList {
  string volume = 1;
  BackupTargetAccess target = 2;
}

// Restores `held` (as `BackupList` names it) from the target as the Volume
// `volume`'s data on this node, which must have none, mounted, then
// `exit_code` 0.
message BackupRestore {
  string volume = 1;
  BackupTargetAccess target = 2;
  // Whose backups: `<namespace>.<volume>` of the Volume backed up.
  string of = 3;
  string held = 4;
}
