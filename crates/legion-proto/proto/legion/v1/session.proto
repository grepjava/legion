// Sessions with a task's containers (DESIGN.md §4.2): logs, exec and
// port-forward. A user opens one at any manager, which checks their rights,
// offers it to the agent of the task's node over that agent's `Sessions`
// stream, and joins the user's stream to the one the agent opens with
// `Attach`.
syntax = "proto3";

package legion.v1;

service Pods {
  // The client's first frame is `open`; after it, for exec and
  // port-forward, input. The server sends output and, for exec, ends with
  // `exit_code`. Logs and forwarded connections end when their stream does.
  rpc Session(stream SessionFrame) returns (stream SessionFrame);
}

message SessionOpen {
  string namespace = 1;
  // A task, or a service, for one of its running tasks.
  string task = 2;
  // The container; may be left out when the pod has only one.
  string container = 3;
  oneof action {
    LogsOptions logs = 4;
    ExecOptions exec = 5;
    // Port-forward: one forwarded connection to this port of the pod.
    uint32 port = 6;
    // Managers only, moving a Volume's data between nodes (DESIGN.md
    // §4.3): the sending agent's output is the receiving agent's input.
    VolumeSend volume_send = 7;
    VolumeReceive volume_receive = 8;
    // Remove this node's copy of a Volume that has moved away.
    string volume_drop = 9;
    // Managers only, a Volume's backup and its restore (DESIGN.md §4.3):
    // the data goes to and comes from the user's stream.
    VolumeExport volume_export = 10;
    VolumeImport volume_import = 11;
  }
}

// Snapshots the Volume, as it is while its tasks run (crash-consistent),
// sends all of it as `stdout` frames and drops the snapshot, ending with
// `exit_code` 0.
message VolumeExport {
  string volume = 1;
}

// Takes what `VolumeExport` sent, from `input` frames until
// `input_closed`, as the Volume's data on this node, which must have none,
// mounts it and ends with `exit_code` 0.
message VolumeImport {
  string volume = 1;
}

// Snapshots the Volume and sends it as `stdout` frames, ending with
// `exit_code` 0.
message VolumeSend {
  string volume = 1;
  // Only what changed since the full copy, from a second snapshot.
  bool last = 2;
}

// Receives what `VolumeSend` sends, from `input` frames until
// `input_closed`, and ends with `exit_code` 0.
message VolumeReceive {
  string volume = 1;
  // The last part: afterwards the dataset is mounted and the migration's
  // snapshots go.
  bool last = 2;
}

message LogsOptions {
  // Keep streaming until the container stops.
  bool follow = 1;
  // Only the last lines (of those in the range, when one is given).
  optional uint32 tail = 2;
  // Only lines written from `since_ms` and before `until_ms`, in
  // milliseconds since the epoch. With either, a line whose time the node
  // does not know is left out. Agents from before ignore both.
  optional int64 since_ms = 3;
  optional int64 until_ms = 4;
  // Each line as a `line` frame, with its time, rather than as `stdout`
  // and `stderr` frames. Agents from before ignore it.
  bool times = 5;
}

// A line of a container's output, with when it was written.
message LogLine {
  bool stderr = 1;
  bytes data = 2;
  // Milliseconds since the epoch; 0 when the node does not know.
  int64 at_ms = 3;
}

message ExecOptions {
  repeated string command = 1;
  // Pass input to the process's stdin.
  bool stdin = 2;
  // Run under a terminal, which merges stderr into stdout.
  bool tty = 3;
  optional TerminalSize size = 4;
}

message TerminalSize {
  uint32 width = 1;
  uint32 height = 2;
}

message SessionError {
  // A gRPC status code.
  int32 code = 1;
  string message = 2;
}

message InputClosed {}

message SessionFrame {
  oneof frame {
    SessionOpen open = 1;
    // To the process's stdin, or the forwarded connection.
    bytes input = 2;
    // No more input: stdin or the connection's sending side closes.
    InputClosed input_closed = 3;
    TerminalSize resize = 4;
    // From the process, or the forwarded connection.
    bytes stdout = 5;
    bytes stderr = 6;
    // The process has exited; the last frame of an exec.
    int32 exit_code = 7;
    // Agents only: the first frame of `Attach`, naming the session.
    string attach = 8;
    // The session failed; the last frame.
    SessionError error = 9;
    // Logs asked with `times`: a line and when it was written.
    LogLine line = 10;
  }
}

// What a manager offers an agent.
message SessionOffer {
  string id = 1;
  // With the namespace, task and container resolved.
  SessionOpen open = 2;
  // The task's run, which the agent knows its containers by.
  string task_uid = 3;
  // The pod's address, for port-forward.
  string pod_ip = 4;
}
