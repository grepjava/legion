// The dispatcher (DESIGN.md §3.4): how agents follow and report the work
// assigned to their node. Every manager serves it; writes and heartbeats go
// to the leader, which a follower forwards them to.
//
// A worker calls as itself: `node` is empty or its certificate's name. A
// manager calls for its own agent or forwards for another node, so `node`
// names the node it acts for.
syntax = "proto3";

package legion.v1;

import "legion/v1/session.proto";

service Dispatcher {
  // Creates the node's Node object or updates its status; returns the pod
  // subnet it holds.
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // The tasks assigned to the node: the complete set first, and again after
  // every change.
  rpc Assignments(AssignmentsRequest) returns (stream AssignmentsUpdate);
  // Every service's endpoints: the complete set first, and again after
  // every change.
  rpc Endpoints(EndpointsRequest) returns (stream EndpointsUpdate);
  // Every node of the WireGuard mesh: the complete set first, and again
  // after every change.
  rpc Peers(PeersRequest) returns (stream PeersUpdate);
  // Namespaces' isolation and every network policy: the complete set
  // first, and again after every change.
  rpc Policies(PoliciesRequest) returns (stream PoliciesUpdate);
  // Every route, for the ingress proxy: the complete set first, and again
  // after every change.
  rpc Routes(RoutesRequest) returns (stream RoutesUpdate);
  // A task's status, from the node it is assigned to.
  rpc Report(ReportRequest) returns (ReportResponse);
  // Binds a volume one of the node's tasks uses to the node, or, with
  // `release`, lets go of one used one node at a time.
  rpc ClaimVolume(ClaimVolumeRequest) returns (ClaimVolumeResponse);
  // A secret or config one of the node's tasks uses.
  rpc Data(DataRequest) returns (DataResponse);
  // Tells the leader the node is alive. A node silent for three periods is
  // marked down.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  // Sessions users open with the node's tasks. An agent keeps this stream
  // open with every manager, so each can reach it, and answers each offer
  // with `Attach` to the manager that made it.
  rpc Sessions(SessionsRequest) returns (stream SessionOffer);
  // An offered session: the agent's first frame is `attach` with its id;
  // then the manager relays the user's input and the agent's output.
  rpc Attach(stream SessionFrame) returns (stream SessionFrame);
}

message SessionsRequest {
  string node = 1;
}

message RegisterRequest {
  string node = 1;
  // NodeStatus as JSON; the manager assigns pod_cidr.
  bytes status_json = 2;
}

message RegisterResponse {
  string pod_cidr = 1;
}

message AssignmentsRequest {
  string node = 1;
}

message AssignmentsUpdate {
  // A JSON array of assignments.
  bytes assignments_json = 1;
}

message EndpointsRequest {
  string node = 1;
}

message EndpointsUpdate {
  // A JSON array of service endpoints.
  bytes endpoints_json = 1;
}

message PeersRequest {
  string node = 1;
}

message PoliciesRequest {
  string node = 1;
}

message RoutesRequest {
  string node = 1;
}

message RoutesUpdate {
  // A JSON array of routes with their namespaces.
  bytes routes_json = 1;
}

message PoliciesUpdate {
  // A JSON object: isolation by namespace, and the policies.
  bytes policies_json = 1;
}

message PeersUpdate {
  // A JSON array of peers.
  bytes peers_json = 1;
}

message ReportRequest {
  string node = 1;
  string namespace = 2;
  string name = 3;
  // The run the status is for; a report for another run is ignored.
  string uid = 4;
  // TaskStatus as JSON.
  bytes status_json = 5;
}

message ReportResponse {}

message ClaimVolumeRequest {
  string node = 1;
  string namespace = 2;
  string name = 3;
  // The node's dataset for it.
  string dataset = 4;
  // The node no longer uses it: it has unmounted and detached it.
  bool release = 5;
}

message ClaimVolumeResponse {
  // VolumeClaim as JSON.
  bytes claim_json = 1;
}

message DataRequest {
  string node = 1;
  string namespace = 2;
  // "Secret" or "Config".
  string kind = 3;
  string name = 4;
}

message DataResponse {
  // Unset when the object does not exist.
  optional bytes value = 1;
}

message HeartbeatRequest {
  string node = 1;
  // What the node's running tasks use, when the agent has read it since
  // its last heartbeat; the autoscaler works from it.
  repeated TaskUsage usage = 2;
}

message TaskUsage {
  string namespace = 1;
  string task = 2;
  // Its containers together, in percent of one CPU.
  double cpu_percent = 3;
  uint64 memory_bytes = 4;
}

message HeartbeatResponse {
  // How often to send heartbeats.
  uint32 period_ms = 1;
  // Every manager's address, for reaching another when this one fails.
  repeated string managers = 2;
}
