// Legion's public API (DESIGN.md §3.2, D2).
syntax = "proto3";

package legion.v1;

import "legion/v1/dispatcher.proto";

// The common envelope (DESIGN.md §7). Specs and statuses travel as JSON until
// each kind gets a typed message.
message Object {
  string kind = 1;
  string namespace = 2;
  string name = 3;
  map<string, string> labels = 4;
  // Set by the server.
  string uid = 5;
  uint64 version = 6;
  uint64 generation = 7;
  bytes spec_json = 8;
  bytes status_json = 9;
}

message ObjectRef {
  string kind = 1;
  // Empty for cluster-scoped kinds; "default" when omitted for the others.
  string namespace = 2;
  string name = 3;
}

service Objects {
  // Server-side apply: creates the object, or replaces its labels and spec.
  // Status is kept. Last applier wins unless expected_version is set. The
  // spec is validated and stored with its defaults filled in.
  rpc Apply(ApplyRequest) returns (ApplyResponse);
  rpc Get(ObjectRef) returns (Object);
  rpc List(ListRequest) returns (ListResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  // Changes after from_version. Ends with ABORTED when the client must list
  // again (history compacted, or the store was reset from a snapshot).
  rpc Watch(WatchRequest) returns (stream WatchEvent);
}

message ApplyRequest {
  Object object = 1;
  // Fail with ABORTED unless the object is at exactly this version; 0
  // unless there is no such object, to make one only.
  optional uint64 expected_version = 2;
  // Validate and return what would be stored, without writing.
  bool dry_run = 3;
}

enum ApplyResult {
  APPLY_RESULT_UNSPECIFIED = 0;
  APPLY_RESULT_CREATED = 1;
  APPLY_RESULT_UPDATED = 2;
  APPLY_RESULT_UNCHANGED = 3;
}

message ApplyResponse {
  Object object = 1;
  ApplyResult result = 2;
}

message ListRequest {
  string kind = 1;
  // Empty: all namespaces.
  string namespace = 2;
  // Every label must match exactly.
  map<string, string> match_labels = 3;
}

message ListResponse {
  repeated Object objects = 1;
  // Watch from this version to follow changes.
  uint64 version = 2;
}

message DeleteRequest {
  ObjectRef ref = 1;
  optional uint64 expected_version = 2;
}

message DeleteResponse {
  uint64 version = 1;
}

message WatchRequest {
  // Empty: every kind.
  string kind = 1;
  uint64 from_version = 2;
}

message WatchEvent {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_PUT = 1;
    TYPE_DELETE = 2;
  }
  Type type = 1;
  Object object = 2;
}

service Cluster {
  // Makes this manager the first member of a new cluster. Fails with
  // ALREADY_EXISTS if it already belongs to one.
  rpc Init(InitRequest) returns (StatusResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
  // The token that lets a node join with `role` ("manager" or "worker");
  // `rotate` replaces it, so the old token stops working.
  rpc JoinToken(JoinTokenRequest) returns (JoinTokenResponse);
  // Certifies a person as user `name`, for `days` (90 when 0). The key
  // stays with the caller, who sends only a certificate request. What the
  // user may do comes from RoleBindings, not the certificate.
  rpc IssueUser(IssueUserRequest) returns (IssueUserResponse);
  // Every object, read at one version, with the cluster's managers: the
  // JSON of a backup (legion_store::Backup) in pieces of up to 1 MiB.
  rpc Backup(BackupRequest) returns (stream BackupChunk);
  // Autolock: `enable` makes the unlock key (or keeps the one there is),
  // `rotate` replaces it, `disable` drops it, `show` only reads it. Every
  // manager seals its private keys with the key, and after a restart waits
  // for it (`Unlock`). Returns the key, empty once disabled.
  rpc Autolock(AutolockRequest) returns (AutolockResponse);
  // The cluster CA and its rotation (DESIGN.md §9): with `start`, makes a
  // new CA every node moves to, the old one trusted until all have; either
  // way, says where the rotation is. The cluster admin's only.
  rpc RotateCa(RotateCaRequest) returns (RotateCaResponse);
  // Asks a node to become a manager or a worker (DESIGN.md §3.7, roles):
  // the node's daemon takes it up, in place, its tasks running on. The
  // cluster admin's only.
  rpc ChangeRole(ChangeRoleRequest) returns (ChangeRoleResponse);
  // A manager asked to become a worker, asking the leader for its worker
  // certificate: it leaves the Raft membership as it gets it. The calling
  // manager's only, for itself.
  rpc Demote(DemoteRequest) returns (DemoteResponse);
  // What tasks use, as their nodes last reported it (within a minute), by
  // node: the tasks of `namespace`, or of every namespace when empty, that
  // the caller may read.
  rpc Usage(UsageRequest) returns (UsageResponse);
  // What tasks used over the last hour, a sample every 15 s, as the
  // leader heard it from their nodes (it keeps no more, and a new leader
  // starts empty): the tasks of `namespace`, or of every namespace when
  // empty, that the caller may read; with `task`, that one only.
  rpc UsageHistory(UsageHistoryRequest) returns (UsageHistoryResponse);
  // Each namespace's quota and what it uses of it now: the requests of its
  // tasks placed and not ended, and its Volumes. The namespaces with a
  // quota whose tasks the caller may read; `namespace` alone when set.
  rpc Quotas(QuotasRequest) returns (QuotasResponse);
  // What an operator acts on now (legion_api::alert): crash-looping
  // tasks, nodes down or suspect, lost Volumes, the CA near expiry, Raft
  // without a leader or quorum, as this manager works them out from its
  // replica, so any manager answers, one cut off from the leader too. The
  // whole list at once, then again each time it changes. A user gets the
  // alerts of `namespace` (every namespace when empty) whose tasks they
  // may read, of nodes if they may read nodes; the cluster's own go to
  // admins.
  rpc WatchAlerts(AlertsRequest) returns (stream AlertsResponse);
  // What may reach what among a namespace's services, as the nodes'
  // guards decide it (DESIGN.md §5.6): for each service, and for the
  // tasks of every other namespace, the ports of each service it may
  // reach. For any caller who may read the namespace's services.
  rpc Reach(ReachRequest) returns (ReachResponse);
  // The connections a namespace's tasks open or answer, as the nodes' pf
  // keeps them: each node asked at once, its connections open or closed
  // in about the last minute and a half, counted by what opened them, what
  // answered, the port and the way it was sent. For any caller who may
  // read the namespace's services; answered by the leader.
  rpc Connections(ConnectionsRequest) returns (ConnectionsResponse);
  // A namespace's load balancer addresses: for each, the nodes that may
  // hold it, by CARP skew (the lowest the master meant), and the CARP
  // state each last reported, which says which holds it. For any caller
  // who may read the namespace's services; answered by the leader.
  rpc LoadBalancers(LoadBalancersRequest) returns (LoadBalancersResponse);
  // What happened to objects lately, as this manager saw it (worked out
  // from the changes its replica sees, kept in memory for an hour): a
  // namespace's, or one object's (a Service's or Job's with its tasks').
  // The first message holds those kept, oldest first; with `follow`, each
  // new one comes as it happens. For any caller who may read the kind there.
  rpc Events(EventsRequest) returns (stream EventsResponse);
  // Long operations, as the leader follows them (legion_api::activity):
  // drains, Volume moves, restores and replicas' whole copies, those under
  // way and those ended in the last hour; with `follow`, each again as it
  // changes. Each as the caller may read its target; who asked, for the
  // cluster admin only.
  rpc Activity(ActivityRequest) returns (stream ActivityResponse);
  // What a drain, a Volume's move, a node's removal or a Service's
  // deletion would do, worked out by the leader over a copy of the cluster
  // (legion_api::dryrun); nothing is changed. Asked as the change itself
  // would be: by who may make it.
  rpc DryRun(DryRunRequest) returns (DryRunResponse);
  // Sends a test through an AlertReceiver now, as it sends alerts, and
  // says whether it was taken: for whoever may write receivers.
  rpc TestAlertReceiver(TestAlertReceiverRequest) returns (TestAlertReceiverResponse);
  // The audit events the filter matches, oldest first, at most `limit`
  // (1000 when 0): the cluster admin's only (legion_api::audit).
  rpc Audit(AuditRequest) returns (AuditResponse);
  // Managers only: audit events a follower decided (the sessions it
  // serves), for the leader to keep with its own.
  rpc RecordAudit(RecordAuditRequest) returns (RecordAuditResponse);
  // Managers only: the leader's samples of what tasks and nodes used,
  // after a time, for a follower to keep too (the 30 days' history).
  rpc UsageArchive(UsageArchiveRequest) returns (UsageArchiveResponse);
  // Who the caller is, and the role RoleBindings give them in each
  // namespace (`all` for the cluster admin, who has every right).
  rpc Me(MeRequest) returns (MeResponse);
  // The web console's sign-in (DESIGN.md §3.9): a one-time code for the
  // calling user or admin, good for one console session, kept 60 s.
  rpc ConsoleCode(ConsoleCodeRequest) returns (ConsoleCodeResponse);
  // Managers only (their console gateway): a session for a code, which
  // is used up.
  rpc ConsoleSession(ConsoleSessionRequest) returns (ConsoleSessionResponse);
  // Managers only: ends a console session (sign-out).
  rpc ConsoleEnd(ConsoleEndRequest) returns (ConsoleEndResponse);
  // The console's settings (CONSOLE.md phase 6): anyone signed in reads
  // them; the cluster admin sets them.
  rpc ConsoleSettings(ConsoleSettingsRequest) returns (ConsoleSettingsResponse);
  rpc SetConsoleSettings(SetConsoleSettingsRequest) returns (ConsoleSettingsResponse);
  // Single sign-on (CONSOLE.md phase 6), the cluster admin's: the OIDC
  // provider the console signs users in with, its client secret never
  // shown again.
  rpc ConsoleOidc(ConsoleOidcRequest) returns (ConsoleOidcResponse);
  rpc SetConsoleOidc(SetConsoleOidcRequest) returns (ConsoleOidcResponse);
  // Managers only (their console gateway): a session for a user their
  // provider vouched for, with their groups.
  rpc ConsoleOidcSession(ConsoleOidcSessionRequest) returns (ConsoleSessionResponse);
  // A Build's log (CONSOLE.md phase 5): what the leader holds of a build
  // it runs, followed with `follow` until it ends; else the end its status
  // kept.
  rpc BuildLogs(BuildLogsRequest) returns (stream BuildLogsChunk);
  // Images cached on nodes: list across nodes, or pull, push, remove or
  // prune on a node. Listing goes to callers who may read nodes; pull,
  // push, remove and prune are the cluster admin's.
  rpc NodeImages(NodeImagesRequest) returns (NodeImagesResponse);
  // Streams a cached image from `node` as an OCI/Docker `.tar` archive
  // (`legion_image::Store::export`); the cluster admin's.
  rpc ExportImage(ExportImageRequest) returns (stream BackupChunk);
  // Streams an OCI/Docker `.tar` archive onto `node` (`Store::load`); the
  // cluster admin's.
  rpc LoadImage(stream LoadImageChunk) returns (NodeImagesResponse);
  // Searches the built-in FreeBSD jail catalog and Docker Hub for images.
  rpc SearchImages(SearchImagesRequest) returns (SearchImagesResponse);
  // Inspects a remote registry image (tags, platforms, digest, cosign).
  rpc InspectRegistryImage(InspectRegistryImageRequest) returns (InspectRegistryImageResponse);
  // What `legion doctor` finds on each node, or on `node`; the cluster
  // admin's.
  rpc Diagnose(DiagnoseRequest) returns (DiagnoseResponse);
  // A node's cached image audited: its FreeBSD packages checked against
  // the FreeBSD VuXML database (`pkg audit`), and what uses it. For those
  // who may read nodes.
  rpc ScanImage(ScanImageRequest) returns (ScanImageResponse);
  // A file to send with a report of trouble: the cluster's objects (Secrets
  // left out, and what could be secret in the rest masked), its managers,
  // alerts, the last hour's events and each node's diagnosis, as JSON; the
  // cluster admin's.
  rpc SupportBundle(SupportBundleRequest) returns (SupportBundleResponse);
}

message ScanImageRequest {
  string node = 1;
  string image = 2;
}

message ScanImageResponse {
  string image = 1;
  string node = 2;
  // Every FreeBSD package in it (its SBOM); none when it has no package
  // database, a Linux image say.
  repeated ImagePackage packages = 3;
  // Those with known vulnerabilities.
  repeated VulnerablePackage vulnerable = 4;
  // As in `NodeImageItem`.
  repeated string used_by = 5;
}

message ImagePackage {
  string name = 1;
  string version = 2;
}

message VulnerablePackage {
  string name = 1;
  string version = 2;
  repeated Vulnerability issues = 3;
}

message Vulnerability {
  string description = 1;
  repeated string cves = 2;
  string url = 3;
  // The versions it affects, as VuXML says them: `< 1.30.1,3`.
  repeated string affected = 4;
}

message DiagnoseRequest {
  // Empty: every node.
  string node = 1;
}

message DiagnoseResponse {
  repeated NodeDiagnosis nodes = 1;
}

message NodeDiagnosis {
  string node = 1;
  // Why it could not be asked: the node is down, or did not answer.
  string error = 2;
  // Every requirement met.
  bool ready = 3;
  repeated DoctorFinding findings = 4;
}

// As `legion doctor --json` says it.
message DoctorFinding {
  // Stable: `racct`, `module.pf`, `zfs.root` and so on.
  string id = 1;
  // met, unmet, unknown or unsupported.
  string state = 2;
  // required or advised.
  string need = 3;
  string detail = 4;
  string remedy = 5;
}

message SupportBundleRequest {}

message SupportBundleResponse {
  bytes json = 1;
}

message MeRequest {}

message MeResponse {
  string name = 1;
  // "admin" or "user".
  string role = 2;
  // Every right, everywhere: the cluster admin.
  bool all = 3;
  // Namespace to role ("view", "edit", "admin"), for a user.
  map<string, string> namespaces = 4;
}

message ConsoleCodeRequest {
  // Set only by a manager forwarding a caller's request to the leader:
  // who asked, and when their certificate expires (Unix ms).
  string for_name = 1;
  string for_role = 2;
  int64 for_until_ms = 3;
}

message ConsoleCodeResponse {
  string code = 1;
  int64 expires_ms = 2;
}

message ConsoleSessionRequest {
  string code = 1;
}

message ConsoleSessionResponse {
  // The session's secret, for the browser's cookie.
  string session = 1;
  string name = 2;
  string role = 3;
  int64 expires_ms = 4;
}

message ConsoleEndRequest {
  string session = 1;
}

message ConsoleEndResponse {}

message ConsoleSettingsRequest {}

message SetConsoleSettingsRequest {
  // legion_api::console::Settings as JSON.
  bytes settings_json = 1;
}

message ConsoleOidcRequest {}

message SetConsoleOidcRequest {
  // legion_api::console::Oidc as JSON; empty with `remove`.
  bytes oidc_json = 1;
  // Empty keeps the secret already set.
  string client_secret = 2;
  // Turns single sign-on off.
  bool remove = 3;
}

message ConsoleOidcResponse {
  // legion_api::console::Oidc as JSON; empty when single sign-on is off.
  bytes oidc_json = 1;
  bool has_secret = 2;
}

message ConsoleOidcSessionRequest {
  // `oidc:` and the provider's name for them.
  string name = 1;
  repeated string groups = 2;
}

message ConsoleSettingsResponse {
  // legion_api::console::Settings as JSON, as now set.
  bytes settings_json = 1;
}

message AuditRequest {
  // legion_api::audit::Filter as JSON; empty for every event.
  bytes filter_json = 1;
  uint32 limit = 2;
}

message AuditResponse {
  // Each a legion_api::audit::AuditEvent as JSON.
  repeated bytes events_json = 1;
  // More matched than `limit`: the newest are left out.
  bool truncated = 2;
}

message RecordAuditRequest {
  repeated bytes events_json = 1;
}

message RecordAuditResponse {}

message UsageArchiveRequest {
  // Milliseconds since the epoch: the samples after it.
  int64 since_ms = 1;
}

message UsageArchiveResponse {
  // The samples, oldest first, as JSON; a full batch means there are more.
  bytes entries_json = 1;
}

message QuotasRequest {
  string namespace = 1;
}

message QuotasResponse {
  repeated NamespaceQuota namespaces = 1;
}

message NamespaceQuota {
  string namespace = 1;
  // Only the resources its quota limits.
  repeated QuotaUse resources = 2;
}

message QuotaUse {
  // `cpu` (in cores), `memory` or `storage` (in bytes), `tasks`, `volumes`.
  string resource = 1;
  double limit = 2;
  double used = 3;
}

message UsageHistoryRequest {
  string namespace = 1;
  // Needs `namespace`.
  string task = 2;
  // How far back, in milliseconds: up to an hour (or 0) is the leader's
  // own samples, every 15 s; past that, from the 30 days kept, a sample a
  // minute within a day and every 15 minutes beyond.
  int64 range_ms = 3;
}

message UsageHistoryResponse {
  repeated TaskSeries tasks = 1;
  // Between samples, in milliseconds.
  int64 step_ms = 2;
  // Node-level ZFS and network series over the range, for callers who
  // may read nodes.
  repeated NodeSeries nodes = 3;
}

message NodeSeries {
  string node = 1;
  repeated NodeSample samples = 2;
}

message NodeSample {
  int64 at_ms = 1;
  uint64 zfs_used_bytes = 2;
  uint64 zfs_avail_bytes = 3;
  uint64 net_rx_bps = 4;
  uint64 net_tx_bps = 5;
}

message TaskSeries {
  string namespace = 1;
  string task = 2;
  // The node that took the latest sample.
  string node = 3;
  repeated UsageSample samples = 4;
  // Its Service or Job, as the store has it; for a task since removed,
  // as its name says (`<service>-<slot>-<n>`).
  string service = 5;
  // What it asks for and may use, as the store has it now (0: none, or a
  // task since removed): percent of one CPU and bytes, as its samples.
  double cpu_request_percent = 6;
  uint64 memory_request_bytes = 7;
  double cpu_limit_percent = 8;
  uint64 memory_limit_bytes = 9;
}

message UsageSample {
  // Milliseconds since the epoch.
  int64 at_ms = 1;
  double cpu_percent = 2;
  uint64 memory_bytes = 3;
}

message AlertsRequest {
  string namespace = 1;
}

message AlertsResponse {
  repeated Alert alerts = 1;
}

message Alert {
  // legion_api::alert::AlertKind, e.g. `crash-loop`.
  string kind = 1;
  // `critical` or `warning`.
  string severity = 2;
  string namespace = 3;
  // What it is about, as `Kind/name`; empty for the cluster itself.
  string object = 4;
  string message = 5;
  // When this manager first saw it, in milliseconds since the epoch.
  int64 since_ms = 6;
}

message UsageRequest {
  string namespace = 1;
}

message ReachRequest {
  string namespace = 1;
}

message ReachResponse {
  // The namespace's services, in name order.
  repeated string services = 1;
  // One per source and destination that it may reach on some port.
  repeated ReachEdge edges = 2;
}

message DryRunRequest {
  // A legion_api::dryrun::Change as JSON.
  bytes change_json = 1;
}

message DryRunResponse {
  // A legion_api::dryrun::DryRun as JSON.
  bytes dry_run_json = 1;
}

message ActivityRequest {
  bool follow = 1;
}

message ActivityResponse {
  // Each a legion_api::activity::Operation as JSON: first all of them,
  // oldest first, then each as it changes.
  repeated bytes operations_json = 1;
}

message EventsRequest {
  // Empty for a cluster's objects (Nodes).
  string namespace = 1;
  // Empty: every kind's.
  string kind = 2;
  // Empty: every object of the kind.
  string name = 3;
  bool follow = 4;
}

message EventsResponse {
  repeated ObjectEvent events = 1;
}

message ObjectEvent {
  // In milliseconds since the epoch, when this manager saw it.
  int64 at_ms = 1;
  string kind = 2;
  string namespace = 3;
  string name = 4;
  // What happened, in a word or two: Created, Running, Restarted.
  string reason = 5;
  string message = 6;
  // A task's Service or Job.
  string owner = 7;
}

message TestAlertReceiverRequest {
  string name = 1;
}

message TestAlertReceiverResponse {}

message LoadBalancersRequest {
  string namespace = 1;
}

message LoadBalancersResponse {
  // By service name.
  repeated LoadBalancer balancers = 1;
}

message LoadBalancer {
  string service = 1;
  string address = 2;
  uint32 vhid = 3;
  // By skew, lowest first.
  repeated LoadBalancerNode nodes = 4;
}

message LoadBalancerNode {
  string node = 1;
  uint32 skew = 2;
  // master, backup or init, as the node last reported in its heartbeats;
  // empty when it did not (a node down, or of a build before reports).
  string state = 3;
}

message ReachEdge {
  // A service of the namespace; empty for the tasks of other namespaces.
  string from = 1;
  string to = 2;
  // Every port of its tasks, not only those the service names.
  bool all_ports = 3;
  // The service's ports it may reach (its tasks' ports), when not all.
  repeated ReachPort ports = 4;
}

message ConnectionsRequest {
  string namespace = 1;
}

message ConnectionsResponse {
  // One per opening end, answering end, protocol, port and way.
  repeated ConnectionEdge edges = 1;
  // The nodes asked that did not say, and why: their connections are
  // missing.
  repeated NodeError unanswered = 2;
}

message NodeError {
  string node = 1;
  string error = 2;
}

// An end of a connection.
message ConnectionEnd {
  // "service" or "job", of the namespace, by name; "namespace", a task of
  // another namespace, unnamed, as in Reach; "node", a node of the
  // cluster (its own address, or forwarding for a client), by name;
  // "outside", anything else, unnamed.
  string kind = 1;
  string name = 2;
}

message ConnectionEdge {
  ConnectionEnd from = 1;
  ConnectionEnd to = 2;
  // "tcp" or "udp".
  string protocol = 3;
  // The port that answered.
  uint32 port = 4;
  // Where the client sent them: "service", to the service's address;
  // "published", to a port a node publishes; empty, to the task's own.
  string via = 5;
  uint32 connections = 6;
  // Distinct addresses among the opening ends: an "outside" end may be
  // many clients.
  uint32 clients = 7;
}

message ReachPort {
  // "tcp" or "udp".
  string protocol = 1;
  uint32 port = 2;
}

message UsageResponse {
  repeated NodeUsage nodes = 1;
}

message NodeUsage {
  string node = 1;
  repeated TaskUsage tasks = 2;
  uint64 zfs_used_bytes = 3;
  uint64 zfs_avail_bytes = 4;
  uint64 net_rx_bps = 5;
  uint64 net_tx_bps = 6;
  repeated VolumeTelemetry volumes = 7;
  // As in the agent's `NodeTelemetry`.
  uint64 images_bytes = 8;
  uint64 jails_bytes = 9;
  uint64 build_bytes = 10;
  // The host's load averages, in hundredths.
  uint32 load1 = 11;
  uint32 load5 = 12;
  uint32 load15 = 13;
}

message AutolockRequest {
  string action = 1;
}

message AutolockResponse {
  string key = 1;
}

message RotateCaRequest {
  bool start = 1;
}

message ChangeRoleRequest {
  string node = 1;
  // "manager" or "worker".
  string role = 2;
}

message ChangeRoleResponse {}

message DemoteRequest {
  // A PEM certificate request for the node's new key.
  string csr_pem = 1;
}

message DemoteResponse {
  string cert_pem = 1;
  // The CAs the cluster trusts, the issuing one first.
  string ca_pem = 2;
  // The managers it calls from now, `host:port`.
  repeated string managers = 3;
}

message RotateCaResponse {
  // The CA that issues certificates now.
  string digest = 1;
  // While a rotation runs, the CA before it, still trusted; empty after.
  string previous_digest = 2;
  // When the rotation began, in ms since the epoch; 0 when none runs.
  uint64 since_ms = 3;
  // Every manager and node, and the CA its certificate is of.
  repeated CaHolder holders = 4;
}

message CaHolder {
  string name = 1;
  // "manager" or "node".
  string kind = 2;
  // The digest of the CA its certificate is of; empty when not known
  // (a node not heard from since this leader leads, a manager not reached).
  string issuer = 3;
}

// A Volume's data, apart from the control state's backup (DESIGN.md §4.3).
service Volumes {
  // A snapshot of the Volume taken as its tasks run (crash-consistent):
  // first a header, the JSON of a `VolumeBackupHeader` (legion-api), then
  // the snapshot's `zfs send` stream, in pieces of up to 1 MiB.
  rpc Backup(VolumeBackupRequest) returns (stream BackupChunk);
  // The client sends `start`, then the stream a backup gave, then closes.
  // The data goes to `node`, and only once all of it is there is the
  // Volume created, on that node; a Volume of that name must not exist.
  rpc Restore(stream VolumeRestoreChunk) returns (VolumeRestoreResponse);
  // Lists, creates, rolls back or deletes ZFS snapshots of a Volume on the
  // node holding it.
  rpc Snapshot(VolumeSnapshotRequest) returns (VolumeSnapshotResponse);
  // Hands a Volume whose node is down to its replica, by hand: the Volume
  // carries on from the replica's last copy of that node's data, on the
  // replica's node, as `failover: automatic` does on its own once the
  // tasks there have surely stopped. The caller answers for that here:
  // whatever still runs on the node writes to a copy no longer the
  // Volume's, dropped once the node is back.
  rpc Promote(VolumePromoteRequest) returns (VolumePromoteResponse);
}

message VolumePromoteRequest {
  string namespace = 1;
  string name = 2;
}

message VolumePromoteResponse {
  // The node the Volume carries on on, and the status's account of it.
  string node = 1;
  string promoted = 2;
}

message VolumeSnapshotRequest {
  string namespace = 1;
  string name = 2;
  // "list", "create", "rollback", "delete".
  string op = 3;
  string snapshot = 4;
}

message VolumeSnapshotResponse {
  repeated string snapshots = 1;
}

message NodeImagesRequest {
  // "list", "pull", "push", "remove", "prune".
  string op = 1;
  // Empty on "list" queries every ready node; required on mutations.
  string node = 2;
  string image = 3;
  // Target `registry/repo:tag` for "push".
  string target = 4;
  // Optional namespace + Secret name holding `.dockerconfigjson` auth.
  string namespace = 5;
  string secret = 6;
}

message NodeImageItem {
  string node = 1;
  string reference = 2;
  string digest = 3;
  string os = 4;
  string arch = 5;
  uint32 layers = 6;
  // The services, Jobs and cron jobs whose pods name this image, as
  // `Kind namespace/name`, of those the caller may read.
  repeated string used_by = 7;
  // A VM image (`legion.vm.image`), not a jail's.
  bool vm = 8;
}

message NodeImagesResponse {
  repeated NodeImageItem images = 1;
  uint64 removed = 2;
  string digest = 3;
}

message ExportImageRequest {
  string node = 1;
  string image = 2;
  // Optional tag to embed in Docker `manifest.json`.
  string tag = 3;
}

message LoadImageStart {
  string node = 1;
  // Reference to record when the archive has none.
  string reference = 2;
}

message LoadImageChunk {
  oneof part {
    LoadImageStart start = 1;
    bytes data = 2;
  }
}

message SearchImagesRequest {
  string query = 1;
  uint32 limit = 2;
  string namespace = 3;
  string secret = 4;
}

message RegistrySearchHit {
  string name = 1;
  string description = 2;
  uint64 stars = 3;
  bool official = 4;
  // "freebsd-catalog", "docker-hub" or "ghcr.io".
  string source = 5;
  string suggested_tag = 6;
  // "freebsd", "linux", or empty when the search does not know.
  string os = 7;
}

message SearchImagesResponse {
  repeated RegistrySearchHit results = 1;
}

message InspectRegistryImageRequest {
  string image = 1;
  string namespace = 2;
  string secret = 3;
  // A node whose cached copy is read instead of the registry: for images
  // no registry serves, built or loaded there.
  string node = 4;
}

// One step of how an image was built, from its config's history.
message ImageStep {
  string created = 1;
  string created_by = 2;
  // A step that changed only the config, adding no layer.
  bool empty_layer = 3;
  // The compressed size of the layer it added; 0 when not known.
  uint64 size = 4;
}

// How the image runs when a pod does not say otherwise.
message ImageRun {
  repeated string entrypoint = 1;
  repeated string cmd = 2;
  repeated string env = 3;
  string user = 4;
  string working_dir = 5;
  repeated string exposed_ports = 6;
  map<string, string> labels = 7;
}

message RegistryPlatform {
  string os = 1;
  string arch = 2;
  string digest = 3;
}

message InspectRegistryImageResponse {
  string image = 1;
  string digest = 2;
  repeated RegistryPlatform platforms = 3;
  repeated string tags = 4;
  bool signed = 5;
  // Of the platform a node would run: FreeBSD first, then Linux.
  string os = 6;
  string arch = 7;
  string created = 8;
  repeated ImageStep history = 9;
  ImageRun run = 10;
  // All its layers, compressed; 0 when not known.
  uint64 size = 11;
  // As in `NodeImageItem`.
  repeated string used_by = 12;
  // The attestations kept for it (cosign attest), each checked against
  // the keys of the ImagePolicies covering it.
  repeated ImageAttestation attestations = 13;
}

message ImageAttestation {
  // The in-toto predicate type, a URI.
  string predicate_type = 1;
  // The fingerprint of the covering policies' key that signed it; empty
  // when none did, or no policy covers the image.
  string verified_key = 2;
  // Why it is not verified, when a policy covers the image.
  string why = 3;
  // For an SBOM (SPDX, CycloneDX): its packages.
  repeated ImagePackage packages = 4;
  // For the rest (provenance, say): the predicate as JSON, the first
  // 64 KiB of it.
  string predicate_json = 5;
}

message VolumeBackupRequest {
  string namespace = 1;
  string name = 2;
}

message VolumeRestoreChunk {
  oneof part {
    VolumeRestoreStart start = 1;
    bytes data = 2;
  }
}

message VolumeRestoreStart {
  string namespace = 1;
  // The Volume's name; empty for the backup's.
  string name = 2;
  string node = 3;
  // The backup's header, as `Backup` sent it.
  string header_json = 4;
  // Restore into the Volume of that name, lost with its node (its
  // status.lost), keeping it and what uses it; refused for any other.
  bool replace = 5;
}

message VolumeRestoreResponse {}

// What a locked manager serves, in the clear and to its own host only,
// until it is given the unlock key.
service Unlock {
  rpc Unlock(UnlockRequest) returns (UnlockResponse);
}

message UnlockRequest {
  string key = 1;
}

message UnlockResponse {}

message BackupRequest {}

message BuildLogsRequest {
  string namespace = 1;
  string name = 2;
  bool follow = 3;
}

message BuildLogsChunk {
  bytes data = 1;
}

message BackupChunk {
  bytes data = 1;
}

message IssueUserRequest {
  string name = 1;
  string csr_pem = 2;
  uint32 days = 3;
}

message IssueUserResponse {
  string cert_pem = 1;
  string ca_pem = 2;
}

message JoinTokenRequest {
  string role = 1;
  bool rotate = 2;
}

message JoinTokenResponse {
  string token = 1;
}

// The one service callers reach without a client certificate: a node
// presents a join token and gets one.
service Join {
  rpc Join(JoinRequest) returns (JoinResponse);
}

message JoinRequest {
  // LGN-1-<ca-digest>-<secret>.
  string token = 1;
  // The node's name, for its certificate.
  string name = 2;
  // A PEM certificate request for the node's own key.
  string csr_pem = 3;
  // Managers only: the Raft id and the address other managers use.
  uint64 node_id = 4;
  string advertise = 5;
  // What the joining build speaks, and the oldest it works with
  // (legion_api::protocol); 0 from builds before the handshake.
  uint32 protocol = 6;
  uint32 oldest_protocol = 7;
}

message JoinResponse {
  // "manager" or "worker", from the token.
  string role = 1;
  string cert_pem = 2;
  // The CA that issues, then any other the cluster trusts while its CA is
  // rotated.
  string ca_pem = 3;
  // Managers only: they issue certificates too.
  string ca_key_pem = 4;
  // What the cluster's managers speak, and the oldest they work with.
  uint32 protocol = 5;
  uint32 oldest_protocol = 6;
}

message InitRequest {}

message StatusRequest {}

message StatusResponse {
  uint64 node_id = 1;
  optional uint64 leader_id = 2;
  // "Leader", "Follower", "Candidate", "Learner" or "Shutdown".
  string state = 3;
  uint64 term = 4;
  uint64 applied_version = 5;
  repeated Member members = 6;
  // The protocol this manager speaks, and the managers' floor as it last
  // read it (legion_api::protocol); 0 from builds before the handshake.
  uint32 protocol = 7;
  uint32 protocol_floor = 8;
  // This manager's node name, its certificate's; empty from builds before
  // 0.1.18. The leader reads it to know each member by name.
  string name = 9;
  // The digest of the CA this manager's certificate is of; empty from
  // builds before CA rotation.
  string ca_issuer = 10;
}

message Member {
  uint64 id = 1;
  string addr = 2;
  bool voter = 3;
}
