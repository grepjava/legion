// Legion's public API (DESIGN.md §3.2, D2).
syntax = "proto3";

package legion.v1;

import "legion/v1/dispatcher.proto";

// The common envelope (DESIGN.md §7). Specs and statuses travel as JSON until
// each kind gets a typed message.
message Object {
  string kind = 1;
  string namespace = 2;
  string name = 3;
  map<string, string> labels = 4;
  // Set by the server.
  string uid = 5;
  uint64 version = 6;
  uint64 generation = 7;
  bytes spec_json = 8;
  bytes status_json = 9;
}

message ObjectRef {
  string kind = 1;
  // Empty for cluster-scoped kinds; "default" when omitted for the others.
  string namespace = 2;
  string name = 3;
}

service Objects {
  // Server-side apply: creates the object, or replaces its labels and spec.
  // Status is kept. Last applier wins unless expected_version is set. The
  // spec is validated and stored with its defaults filled in.
  rpc Apply(ApplyRequest) returns (ApplyResponse);
  rpc Get(ObjectRef) returns (Object);
  rpc List(ListRequest) returns (ListResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  // Changes after from_version. Ends with ABORTED when the client must list
  // again (history compacted, or the store was reset from a snapshot).
  rpc Watch(WatchRequest) returns (stream WatchEvent);
}

message ApplyRequest {
  Object object = 1;
  // Fail with ABORTED unless the object is at exactly this version.
  optional uint64 expected_version = 2;
  // Validate and return what would be stored, without writing.
  bool dry_run = 3;
}

enum ApplyResult {
  APPLY_RESULT_UNSPECIFIED = 0;
  APPLY_RESULT_CREATED = 1;
  APPLY_RESULT_UPDATED = 2;
  APPLY_RESULT_UNCHANGED = 3;
}

message ApplyResponse {
  Object object = 1;
  ApplyResult result = 2;
}

message ListRequest {
  string kind = 1;
  // Empty: all namespaces.
  string namespace = 2;
  // Every label must match exactly.
  map<string, string> match_labels = 3;
}

message ListResponse {
  repeated Object objects = 1;
  // Watch from this version to follow changes.
  uint64 version = 2;
}

message DeleteRequest {
  ObjectRef ref = 1;
  optional uint64 expected_version = 2;
}

message DeleteResponse {
  uint64 version = 1;
}

message WatchRequest {
  // Empty: every kind.
  string kind = 1;
  uint64 from_version = 2;
}

message WatchEvent {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_PUT = 1;
    TYPE_DELETE = 2;
  }
  Type type = 1;
  Object object = 2;
}

service Cluster {
  // Makes this manager the first member of a new cluster. Fails with
  // ALREADY_EXISTS if it already belongs to one.
  rpc Init(InitRequest) returns (StatusResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
  // The token that lets a node join with `role` ("manager" or "worker");
  // `rotate` replaces it, so the old token stops working.
  rpc JoinToken(JoinTokenRequest) returns (JoinTokenResponse);
  // Certifies a person as user `name`, for `days` (90 when 0). The key
  // stays with the caller, who sends only a certificate request. What the
  // user may do comes from RoleBindings, not the certificate.
  rpc IssueUser(IssueUserRequest) returns (IssueUserResponse);
  // Every object, read at one version, with the cluster's managers: the
  // JSON of a backup (legion_store::Backup) in pieces of up to 1 MiB.
  rpc Backup(BackupRequest) returns (stream BackupChunk);
  // Autolock: `enable` makes the unlock key (or keeps the one there is),
  // `rotate` replaces it, `disable` drops it, `show` only reads it. Every
  // manager seals its private keys with the key, and after a restart waits
  // for it (`Unlock`). Returns the key, empty once disabled.
  rpc Autolock(AutolockRequest) returns (AutolockResponse);
  // The cluster CA and its rotation (DESIGN.md §9): with `start`, makes a
  // new CA every node moves to, the old one trusted until all have; either
  // way, says where the rotation is. The cluster admin's only.
  rpc RotateCa(RotateCaRequest) returns (RotateCaResponse);
  // Asks a node to become a manager or a worker (DESIGN.md §3.7, roles):
  // the node's daemon takes it up, in place, its tasks running on. The
  // cluster admin's only.
  rpc ChangeRole(ChangeRoleRequest) returns (ChangeRoleResponse);
  // A manager asked to become a worker, asking the leader for its worker
  // certificate: it leaves the Raft membership as it gets it. The calling
  // manager's only, for itself.
  rpc Demote(DemoteRequest) returns (DemoteResponse);
  // What tasks use, as their nodes last reported it (within a minute), by
  // node: the tasks of `namespace`, or of every namespace when empty, that
  // the caller may read.
  rpc Usage(UsageRequest) returns (UsageResponse);
  // What tasks used over the last hour, a sample every 15 s, as the
  // leader heard it from their nodes (it keeps no more, and a new leader
  // starts empty): the tasks of `namespace`, or of every namespace when
  // empty, that the caller may read; with `task`, that one only.
  rpc UsageHistory(UsageHistoryRequest) returns (UsageHistoryResponse);
  // Each namespace's quota and what it uses of it now: the requests of its
  // tasks placed and not ended, and its Volumes. The namespaces with a
  // quota whose tasks the caller may read; `namespace` alone when set.
  rpc Quotas(QuotasRequest) returns (QuotasResponse);
  // What an operator acts on now (legion_api::alert): crash-looping
  // tasks, nodes down or suspect, lost Volumes, the CA near expiry, Raft
  // without a leader or quorum, as this manager works them out from its
  // replica, so any manager answers, one cut off from the leader too. The
  // whole list at once, then again each time it changes. A user gets the
  // alerts of `namespace` (every namespace when empty) whose tasks they
  // may read, of nodes if they may read nodes; the cluster's own go to
  // admins.
  rpc WatchAlerts(AlertsRequest) returns (stream AlertsResponse);
  // What may reach what among a namespace's services, as the nodes'
  // guards decide it (DESIGN.md §5.6): for each service, and for the
  // tasks of every other namespace, the ports of each service it may
  // reach. For any caller who may read the namespace's services.
  rpc Reach(ReachRequest) returns (ReachResponse);
  // The audit events the filter matches, oldest first, at most `limit`
  // (1000 when 0): the cluster admin's only (legion_api::audit).
  rpc Audit(AuditRequest) returns (AuditResponse);
  // Managers only: audit events a follower decided (the sessions it
  // serves), for the leader to keep with its own.
  rpc RecordAudit(RecordAuditRequest) returns (RecordAuditResponse);
  // Who the caller is, and the role RoleBindings give them in each
  // namespace (`all` for the cluster admin, who has every right).
  rpc Me(MeRequest) returns (MeResponse);
  // The web console's sign-in (DESIGN.md §3.9): a one-time code for the
  // calling user or admin, good for one console session, kept 60 s.
  rpc ConsoleCode(ConsoleCodeRequest) returns (ConsoleCodeResponse);
  // Managers only (their console gateway): a session for a code, which
  // is used up.
  rpc ConsoleSession(ConsoleSessionRequest) returns (ConsoleSessionResponse);
  // Managers only: ends a console session (sign-out).
  rpc ConsoleEnd(ConsoleEndRequest) returns (ConsoleEndResponse);
}

message MeRequest {}

message MeResponse {
  string name = 1;
  // "admin" or "user".
  string role = 2;
  // Every right, everywhere: the cluster admin.
  bool all = 3;
  // Namespace to role ("view", "edit", "admin"), for a user.
  map<string, string> namespaces = 4;
}

message ConsoleCodeRequest {
  // Set only by a manager forwarding a caller's request to the leader:
  // who asked, and when their certificate expires (Unix ms).
  string for_name = 1;
  string for_role = 2;
  int64 for_until_ms = 3;
}

message ConsoleCodeResponse {
  string code = 1;
  int64 expires_ms = 2;
}

message ConsoleSessionRequest {
  string code = 1;
}

message ConsoleSessionResponse {
  // The session's secret, for the browser's cookie.
  string session = 1;
  string name = 2;
  string role = 3;
  int64 expires_ms = 4;
}

message ConsoleEndRequest {
  string session = 1;
}

message ConsoleEndResponse {}

message AuditRequest {
  // legion_api::audit::Filter as JSON; empty for every event.
  bytes filter_json = 1;
  uint32 limit = 2;
}

message AuditResponse {
  // Each a legion_api::audit::AuditEvent as JSON.
  repeated bytes events_json = 1;
  // More matched than `limit`: the newest are left out.
  bool truncated = 2;
}

message RecordAuditRequest {
  repeated bytes events_json = 1;
}

message RecordAuditResponse {}

message QuotasRequest {
  string namespace = 1;
}

message QuotasResponse {
  repeated NamespaceQuota namespaces = 1;
}

message NamespaceQuota {
  string namespace = 1;
  // Only the resources its quota limits.
  repeated QuotaUse resources = 2;
}

message QuotaUse {
  // `cpu` (in cores), `memory` or `storage` (in bytes), `tasks`, `volumes`.
  string resource = 1;
  double limit = 2;
  double used = 3;
}

message UsageHistoryRequest {
  string namespace = 1;
  // Needs `namespace`.
  string task = 2;
}

message UsageHistoryResponse {
  repeated TaskSeries tasks = 1;
  // Between samples, in milliseconds.
  int64 step_ms = 2;
}

message TaskSeries {
  string namespace = 1;
  string task = 2;
  // The node that took the latest sample.
  string node = 3;
  repeated UsageSample samples = 4;
  // Its Service or Job, as the store has it; for a task since removed,
  // as its name says (`<service>-<slot>-<n>`).
  string service = 5;
  // What it asks for and may use, as the store has it now (0: none, or a
  // task since removed): percent of one CPU and bytes, as its samples.
  double cpu_request_percent = 6;
  uint64 memory_request_bytes = 7;
  double cpu_limit_percent = 8;
  uint64 memory_limit_bytes = 9;
}

message UsageSample {
  // Milliseconds since the epoch.
  int64 at_ms = 1;
  double cpu_percent = 2;
  uint64 memory_bytes = 3;
}

message AlertsRequest {
  string namespace = 1;
}

message AlertsResponse {
  repeated Alert alerts = 1;
}

message Alert {
  // legion_api::alert::AlertKind, e.g. `crash-loop`.
  string kind = 1;
  // `critical` or `warning`.
  string severity = 2;
  string namespace = 3;
  // What it is about, as `Kind/name`; empty for the cluster itself.
  string object = 4;
  string message = 5;
  // When this manager first saw it, in milliseconds since the epoch.
  int64 since_ms = 6;
}

message UsageRequest {
  string namespace = 1;
}

message ReachRequest {
  string namespace = 1;
}

message ReachResponse {
  // The namespace's services, in name order.
  repeated string services = 1;
  // One per source and destination that it may reach on some port.
  repeated ReachEdge edges = 2;
}

message ReachEdge {
  // A service of the namespace; empty for the tasks of other namespaces.
  string from = 1;
  string to = 2;
  // Every port of its tasks, not only those the service names.
  bool all_ports = 3;
  // The service's ports it may reach (its tasks' ports), when not all.
  repeated ReachPort ports = 4;
}

message ReachPort {
  // "tcp" or "udp".
  string protocol = 1;
  uint32 port = 2;
}

message UsageResponse {
  repeated NodeUsage nodes = 1;
}

message NodeUsage {
  string node = 1;
  repeated TaskUsage tasks = 2;
}

message AutolockRequest {
  string action = 1;
}

message AutolockResponse {
  string key = 1;
}

message RotateCaRequest {
  bool start = 1;
}

message ChangeRoleRequest {
  string node = 1;
  // "manager" or "worker".
  string role = 2;
}

message ChangeRoleResponse {}

message DemoteRequest {
  // A PEM certificate request for the node's new key.
  string csr_pem = 1;
}

message DemoteResponse {
  string cert_pem = 1;
  // The CAs the cluster trusts, the issuing one first.
  string ca_pem = 2;
  // The managers it calls from now, `host:port`.
  repeated string managers = 3;
}

message RotateCaResponse {
  // The CA that issues certificates now.
  string digest = 1;
  // While a rotation runs, the CA before it, still trusted; empty after.
  string previous_digest = 2;
  // When the rotation began, in ms since the epoch; 0 when none runs.
  uint64 since_ms = 3;
  // Every manager and node, and the CA its certificate is of.
  repeated CaHolder holders = 4;
}

message CaHolder {
  string name = 1;
  // "manager" or "node".
  string kind = 2;
  // The digest of the CA its certificate is of; empty when not known
  // (a node not heard from since this leader leads, a manager not reached).
  string issuer = 3;
}

// A Volume's data, apart from the control state's backup (DESIGN.md §4.3).
service Volumes {
  // A snapshot of the Volume taken as its tasks run (crash-consistent):
  // first a header, the JSON of a `VolumeBackupHeader` (legion-api), then
  // the snapshot's `zfs send` stream, in pieces of up to 1 MiB.
  rpc Backup(VolumeBackupRequest) returns (stream BackupChunk);
  // The client sends `start`, then the stream a backup gave, then closes.
  // The data goes to `node`, and only once all of it is there is the
  // Volume created, on that node; a Volume of that name must not exist.
  rpc Restore(stream VolumeRestoreChunk) returns (VolumeRestoreResponse);
}

message VolumeBackupRequest {
  string namespace = 1;
  string name = 2;
}

message VolumeRestoreChunk {
  oneof part {
    VolumeRestoreStart start = 1;
    bytes data = 2;
  }
}

message VolumeRestoreStart {
  string namespace = 1;
  // The Volume's name; empty for the backup's.
  string name = 2;
  string node = 3;
  // The backup's header, as `Backup` sent it.
  string header_json = 4;
  // Restore into the Volume of that name, lost with its node (its
  // status.lost), keeping it and what uses it; refused for any other.
  bool replace = 5;
}

message VolumeRestoreResponse {}

// What a locked manager serves, in the clear and to its own host only,
// until it is given the unlock key.
service Unlock {
  rpc Unlock(UnlockRequest) returns (UnlockResponse);
}

message UnlockRequest {
  string key = 1;
}

message UnlockResponse {}

message BackupRequest {}

message BackupChunk {
  bytes data = 1;
}

message IssueUserRequest {
  string name = 1;
  string csr_pem = 2;
  uint32 days = 3;
}

message IssueUserResponse {
  string cert_pem = 1;
  string ca_pem = 2;
}

message JoinTokenRequest {
  string role = 1;
  bool rotate = 2;
}

message JoinTokenResponse {
  string token = 1;
}

// The one service callers reach without a client certificate: a node
// presents a join token and gets one.
service Join {
  rpc Join(JoinRequest) returns (JoinResponse);
}

message JoinRequest {
  // LGN-1-<ca-digest>-<secret>.
  string token = 1;
  // The node's name, for its certificate.
  string name = 2;
  // A PEM certificate request for the node's own key.
  string csr_pem = 3;
  // Managers only: the Raft id and the address other managers use.
  uint64 node_id = 4;
  string advertise = 5;
  // What the joining build speaks, and the oldest it works with
  // (legion_api::protocol); 0 from builds before the handshake.
  uint32 protocol = 6;
  uint32 oldest_protocol = 7;
}

message JoinResponse {
  // "manager" or "worker", from the token.
  string role = 1;
  string cert_pem = 2;
  // The CA that issues, then any other the cluster trusts while its CA is
  // rotated.
  string ca_pem = 3;
  // Managers only: they issue certificates too.
  string ca_key_pem = 4;
  // What the cluster's managers speak, and the oldest they work with.
  uint32 protocol = 5;
  uint32 oldest_protocol = 6;
}

message InitRequest {}

message StatusRequest {}

message StatusResponse {
  uint64 node_id = 1;
  optional uint64 leader_id = 2;
  // "Leader", "Follower", "Candidate", "Learner" or "Shutdown".
  string state = 3;
  uint64 term = 4;
  uint64 applied_version = 5;
  repeated Member members = 6;
  // The protocol this manager speaks, and the managers' floor as it last
  // read it (legion_api::protocol); 0 from builds before the handshake.
  uint32 protocol = 7;
  uint32 protocol_floor = 8;
  // This manager's node name, its certificate's; empty from builds before
  // 0.1.18. The leader reads it to know each member by name.
  string name = 9;
  // The digest of the CA this manager's certificate is of; empty from
  // builds before CA rotation.
  string ca_issuer = 10;
}

message Member {
  uint64 id = 1;
  string addr = 2;
  bool voter = 3;
}
