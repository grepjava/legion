// Legion's public API (DESIGN.md §3.2, D2).
syntax = "proto3";

package legion.v1;

import "legion/v1/dispatcher.proto";

// The common envelope (DESIGN.md §7). Specs and statuses travel as JSON until
// each kind gets a typed message.
message Object {
  string kind = 1;
  string namespace = 2;
  string name = 3;
  map<string, string> labels = 4;
  // Set by the server.
  string uid = 5;
  uint64 version = 6;
  uint64 generation = 7;
  bytes spec_json = 8;
  bytes status_json = 9;
}

message ObjectRef {
  string kind = 1;
  // Empty for cluster-scoped kinds; "default" when omitted for the others.
  string namespace = 2;
  string name = 3;
}

service Objects {
  // Server-side apply: creates the object, or replaces its labels and spec.
  // Status is kept. Last applier wins unless expected_version is set. The
  // spec is validated and stored with its defaults filled in.
  rpc Apply(ApplyRequest) returns (ApplyResponse);
  rpc Get(ObjectRef) returns (Object);
  rpc List(ListRequest) returns (ListResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  // Changes after from_version. Ends with ABORTED when the client must list
  // again (history compacted, or the store was reset from a snapshot).
  rpc Watch(WatchRequest) returns (stream WatchEvent);
}

message ApplyRequest {
  Object object = 1;
  // Fail with ABORTED unless the object is at exactly this version.
  optional uint64 expected_version = 2;
  // Validate and return what would be stored, without writing.
  bool dry_run = 3;
}

enum ApplyResult {
  APPLY_RESULT_UNSPECIFIED = 0;
  APPLY_RESULT_CREATED = 1;
  APPLY_RESULT_UPDATED = 2;
  APPLY_RESULT_UNCHANGED = 3;
}

message ApplyResponse {
  Object object = 1;
  ApplyResult result = 2;
}

message ListRequest {
  string kind = 1;
  // Empty: all namespaces.
  string namespace = 2;
  // Every label must match exactly.
  map<string, string> match_labels = 3;
}

message ListResponse {
  repeated Object objects = 1;
  // Watch from this version to follow changes.
  uint64 version = 2;
}

message DeleteRequest {
  ObjectRef ref = 1;
  optional uint64 expected_version = 2;
}

message DeleteResponse {
  uint64 version = 1;
}

message WatchRequest {
  // Empty: every kind.
  string kind = 1;
  uint64 from_version = 2;
}

message WatchEvent {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_PUT = 1;
    TYPE_DELETE = 2;
  }
  Type type = 1;
  Object object = 2;
}

service Cluster {
  // Makes this manager the first member of a new cluster. Fails with
  // ALREADY_EXISTS if it already belongs to one.
  rpc Init(InitRequest) returns (StatusResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
  // The token that lets a node join with `role` ("manager" or "worker");
  // `rotate` replaces it, so the old token stops working.
  rpc JoinToken(JoinTokenRequest) returns (JoinTokenResponse);
  // Certifies a person as user `name`, for `days` (90 when 0). The key
  // stays with the caller, who sends only a certificate request. What the
  // user may do comes from RoleBindings, not the certificate.
  rpc IssueUser(IssueUserRequest) returns (IssueUserResponse);
  // Every object, read at one version, with the cluster's managers: the
  // JSON of a backup (legion_store::Backup) in pieces of up to 1 MiB.
  rpc Backup(BackupRequest) returns (stream BackupChunk);
  // Autolock: `enable` makes the unlock key (or keeps the one there is),
  // `rotate` replaces it, `disable` drops it, `show` only reads it. Every
  // manager seals its private keys with the key, and after a restart waits
  // for it (`Unlock`). Returns the key, empty once disabled.
  rpc Autolock(AutolockRequest) returns (AutolockResponse);
  // What tasks use, as their nodes last reported it (within a minute), by
  // node: the tasks of `namespace`, or of every namespace when empty, that
  // the caller may read.
  rpc Usage(UsageRequest) returns (UsageResponse);
}

message UsageRequest {
  string namespace = 1;
}

message UsageResponse {
  repeated NodeUsage nodes = 1;
}

message NodeUsage {
  string node = 1;
  repeated TaskUsage tasks = 2;
}

message AutolockRequest {
  string action = 1;
}

message AutolockResponse {
  string key = 1;
}

// What a locked manager serves, in the clear and to its own host only,
// until it is given the unlock key.
service Unlock {
  rpc Unlock(UnlockRequest) returns (UnlockResponse);
}

message UnlockRequest {
  string key = 1;
}

message UnlockResponse {}

message BackupRequest {}

message BackupChunk {
  bytes data = 1;
}

message IssueUserRequest {
  string name = 1;
  string csr_pem = 2;
  uint32 days = 3;
}

message IssueUserResponse {
  string cert_pem = 1;
  string ca_pem = 2;
}

message JoinTokenRequest {
  string role = 1;
  bool rotate = 2;
}

message JoinTokenResponse {
  string token = 1;
}

// The one service callers reach without a client certificate: a node
// presents a join token and gets one.
service Join {
  rpc Join(JoinRequest) returns (JoinResponse);
}

message JoinRequest {
  // LGN-1-<ca-digest>-<secret>.
  string token = 1;
  // The node's name, for its certificate.
  string name = 2;
  // A PEM certificate request for the node's own key.
  string csr_pem = 3;
  // Managers only: the Raft id and the address other managers use.
  uint64 node_id = 4;
  string advertise = 5;
}

message JoinResponse {
  // "manager" or "worker", from the token.
  string role = 1;
  string cert_pem = 2;
  string ca_pem = 3;
  // Managers only: they issue certificates too.
  string ca_key_pem = 4;
}

message InitRequest {}

message StatusRequest {}

message StatusResponse {
  uint64 node_id = 1;
  optional uint64 leader_id = 2;
  // "Leader", "Follower", "Candidate", "Learner" or "Shutdown".
  string state = 3;
  uint64 term = 4;
  uint64 applied_version = 5;
  repeated Member members = 6;
}

message Member {
  uint64 id = 1;
  string addr = 2;
  bool voter = 3;
}
