# The phase 1 exit test's app (PHASE.md): web, a database and a cache, made
# from FreeBSD base tools only. inetd runs a small sh script per connection.
#
#   web    HTTP on 8080: /healthz, /count (database), /hits (cache)
#   db     a counter store on a ZFS volume: survives restarts and new pods
#   cache  the same store on a tmpfs volume: lost with the pod
#
# web reaches the others by name through the node resolver.
apiVersion: legion/v1
kind: Config
metadata: { name: services, namespace: shop }
spec:
  # inetd takes service names, not port numbers.
  text: |
    legion-web    8080/tcp
    legion-store  7000/tcp
---
apiVersion: legion/v1
kind: Config
metadata: { name: inetd-web, namespace: shop }
spec:
  text: |
    legion-web stream tcp nowait root /bin/sh sh /etc/legion/web.sh
---
apiVersion: legion/v1
kind: Config
metadata: { name: inetd-store, namespace: shop }
spec:
  text: |
    legion-store stream tcp nowait root /bin/sh sh /etc/legion/store.sh
---
apiVersion: legion/v1
kind: Config
metadata: { name: web-sh, namespace: shop }
spec:
  text: |
    # One HTTP/1.0 request on stdin, the response on stdout.
    read -r method path proto
    while read -r line; do
      [ -z "$(printf %s "$line" | tr -d '\r')" ] && break
    done
    reply() { printf 'HTTP/1.0 %s\r\nContent-Type: text/plain\r\n\r\n%s\n' "$1" "$2"; }
    ask() { printf '%s\n' "$2" | nc -N -w 2 "$1" 7000; }
    case "$path" in
      /healthz) reply "200 OK" ok ;;
      /count) n=$(ask db "INCR count") && [ -n "$n" ] && reply "200 OK" "$n" || reply "503 Service Unavailable" "no db" ;;
      /hits) n=$(ask cache "INCR hits") && [ -n "$n" ] && reply "200 OK" "$n" || reply "503 Service Unavailable" "no cache" ;;
      *) reply "404 Not Found" "" ;;
    esac
---
apiVersion: legion/v1
kind: Config
metadata: { name: store-sh, namespace: shop }
spec:
  text: |
    # `INCR <key>` or `GET <key>` on stdin; the value on stdout.
    read -r cmd key
    f="/data/$key"
    case "$cmd" in
      INCR)
        n=$(cat "$f" 2>/dev/null || echo 0)
        n=$((n + 1))
        echo "$n" > "$f.new" && mv "$f.new" "$f"
        echo "$n" ;;
      GET) cat "$f" 2>/dev/null || echo 0 ;;
    esac
---
apiVersion: legion/v1
kind: Volume
metadata: { name: db-data, namespace: shop }
spec:
  size: 64Mi
---
apiVersion: legion/v1
kind: Service
metadata: { name: web, namespace: shop }
spec:
  replicas: 2
  pod:
    containers:
      - name: web
        image: docker.io/freebsd/freebsd-notoolchain:15.1
        command: [/usr/sbin/inetd, -d, /etc/inetd.conf]
        ports: [{ name: http, containerPort: 8080 }]
        configs:
          - { name: services, target: /etc/services }
          - { name: inetd-web, target: /etc/inetd.conf }
          - { name: web-sh, target: /etc/legion/web.sh }
        probes:
          readiness: { http: { port: http, path: /healthz }, period: 2s }
          liveness: { tcp: { port: http }, period: 5s }
        resources: { limits: { memory: 128Mi, maxproc: 64 } }
---
apiVersion: legion/v1
kind: Service
metadata: { name: db, namespace: shop }
spec:
  replicas: 1
  pod:
    containers:
      - name: db
        image: docker.io/freebsd/freebsd-notoolchain:15.1
        command: [/usr/sbin/inetd, -d, /etc/inetd.conf]
        ports: [{ name: store, containerPort: 7000 }]
        configs:
          - { name: services, target: /etc/services }
          - { name: inetd-store, target: /etc/inetd.conf }
          - { name: store-sh, target: /etc/legion/store.sh }
        volumeMounts: [{ name: data, path: /data }]
        probes:
          readiness: { tcp: { port: store }, period: 2s }
    volumes: [{ name: data, volume: { name: db-data } }]
---
apiVersion: legion/v1
kind: Service
metadata: { name: cache, namespace: shop }
spec:
  replicas: 1
  pod:
    containers:
      - name: cache
        image: docker.io/freebsd/freebsd-notoolchain:15.1
        command: [/usr/sbin/inetd, -d, /etc/inetd.conf]
        ports: [{ name: store, containerPort: 7000 }]
        configs:
          - { name: services, target: /etc/services }
          - { name: inetd-store, target: /etc/inetd.conf }
          - { name: store-sh, target: /etc/legion/store.sh }
        volumeMounts: [{ name: data, path: /data }]
        probes:
          readiness: { tcp: { port: store }, period: 2s }
    volumes: [{ name: data, tmpfs: { size: 16Mi } }]
