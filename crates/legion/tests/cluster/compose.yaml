# The phase 2 exit test's app (PHASE.md), as a compose file: made from
# FreeBSD base tools only, inetd running a small sh script per connection.
#
#   web  HTTP on 8080, published on port 30080 of every node. /healthz, and
#        / answering `web <version> <task> api <task>`, asking api by name.
#   api  a line on port 7000: its task's name. Reached through its VIP.
#
# WEB_VERSION changes web's pod, which rolls it start-first, one task at a
# time. Both run three replicas, spread over the three nodes.
services:
  web:
    image: docker.io/freebsd/freebsd-notoolchain:15.1
    command: [/usr/sbin/inetd, -d, /etc/inetd.conf]
    environment:
      VERSION: "${WEB_VERSION:-1}"
    ports: ["30080:8080"]
    configs:
      - { source: services, target: /etc/services }
      - { source: inetd-web, target: /etc/inetd.conf }
      - { source: web-sh, target: /etc/legion/web.sh }
    healthcheck:
      test: ["CMD-SHELL", "printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' | nc -N -w 2 127.0.0.1 8080 | grep -q '200 OK'"]
      interval: 2s
      timeout: 3s
      retries: 3
    deploy:
      replicas: 3
      update_config: { parallelism: 1, delay: 2s, order: start-first, failure_action: rollback, monitor: 5s }
      resources: { limits: { memory: 128M, pids: 64 } }
  api:
    image: docker.io/freebsd/freebsd-notoolchain:15.1
    command: [/usr/sbin/inetd, -d, /etc/inetd.conf]
    configs:
      - { source: services, target: /etc/services }
      - { source: inetd-api, target: /etc/inetd.conf }
    deploy:
      replicas: 3
      resources: { limits: { memory: 64M, pids: 64 } }
    # Compose has no VIP without publishing; Legion does.
    x-legion:
      endpoint: { ports: [{ port: 7000 }] }
      pod:
        containers:
          - name: api
            image: docker.io/freebsd/freebsd-notoolchain:15.1
            command: [/usr/sbin/inetd, -d, /etc/inetd.conf]
            ports: [{ containerPort: 7000 }]
            configs:
              - { name: services, target: /etc/services }
              - { name: inetd-api, target: /etc/inetd.conf }
            probes:
              readiness: { tcp: { port: 7000 }, period: 2s }
            resources: { limits: { memory: 64Mi, maxproc: 64 } }
configs:
  services:
    # inetd takes service names, not port numbers.
    content: |
      legion-web    8080/tcp
      legion-api    7000/tcp
  inetd-web:
    content: |
      legion-web stream tcp nowait root /bin/sh sh /etc/legion/web.sh
  inetd-api:
    content: |
      legion-api stream tcp nowait root /bin/hostname hostname
  web-sh:
    content: |
      # One HTTP/1.0 request on stdin, the response on stdout.
      read -r method path proto
      while read -r line; do
        [ -z "$$(printf %s "$$line" | tr -d '\r')" ] && break
      done
      reply() { printf 'HTTP/1.0 %s\r\nContent-Type: text/plain\r\n\r\n%s\n' "$$1" "$$2"; }
      case "$$path" in
        /healthz) reply "200 OK" ok ;;
        /) api=$$(nc -N -w 2 api 7000 </dev/null) && [ -n "$$api" ] &&
             reply "200 OK" "web $$VERSION $$(hostname) api $$api" ||
             reply "503 Service Unavailable" "no api" ;;
        *) reply "404 Not Found" "" ;;
      esac
