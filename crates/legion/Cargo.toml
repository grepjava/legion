[package]
name = "legion"
description = "Legion daemon and CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap = { workspace = true, features = ["env"] }
futures.workspace = true
getrandom.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
legion-agent.workspace = true
legion-api.workspace = true
legion-build.workspace = true
legion-image.workspace = true
legion-jail.workspace = true
legion-local.workspace = true
legion-pki.workspace = true
legion-manager.workspace = true
legion-net.workspace = true
legion-proto.workspace = true
legion-runtime.workspace = true
legion-store.workspace = true
legion-sys.workspace = true
ratatui.workspace = true
vt100.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
similar.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "process"] }
tokio-stream.workspace = true
tonic = { workspace = true, features = ["tls-ring"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
bytes.workspace = true
ring.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2.workspace = true
tar = { version = "0.4", default-features = false }
tempfile.workspace = true
