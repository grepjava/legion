[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
futures.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
legion-agent.workspace = true
legion-api.workspace = true
legion-image.workspace = true
legion-jail.workspace = true
legion-pki.workspace = true
legion-manager.workspace = true
legion-net.workspace = true
legion-podman.workspace = true
legion-proto.workspace = true
legion-store.workspace = true
legion-sys.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
similar.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util"] }
tokio-stream.workspace = true
tonic = { workspace = true, features = ["tls-ring"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
